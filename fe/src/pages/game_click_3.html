<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmoGarden</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/game_click_3.css" />
    <link rel="stylesheet" href="../styles/chatbot_widget.css" />
</head>

<body>
    <!-- Top back button bar -->
    <div class="top-back-bar">
        <button id="back-button" class="back-btn global-back-btn" type="button" onclick="window.history.back()">
            &#x2190; Quay lại
        </button>
    </div>

    <!-- Màn hình chơi game -->
    <div id="game-screen" class="screen">
        <div class="container">
            <!-- Header (match game_click_2 layout) -->
            <header class="header game-header">
                <div class="header-main">
                    <h1 class="game-title">Đang tải...</h1>
                    <p class="subtitle">Kéo thẻ cảm xúc vào đúng khuôn mặt</p>
                </div>
                <div class="header-actions">
                    <div class="stat-pill progress-pill" aria-label="Tiến độ câu hỏi">
                        <div class="click-level-progress">
                            <div id="click-progress-fill" class="click-level-progress-fill"></div>
                        </div>
                        <span id="progress-label">Câu 1/10</span>
                    </div>
                    <div class="stats">
                        <div class="stat-pill">
                            <span id="score-label">Điểm: 0</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="game-container">

                <!-- Phần tình huống -->
                <div class="hint-section">
                    <button class="speaker-btn" onclick="speakHints()">🔊</button>
                    <div class="hint-content">
                        <h3>💡 Tình huống:</h3>
                        <div id="hints-list"></div>
                    </div>
                </div>

                <!-- Lưới khuôn mặt -->
                <div id="faces-grid" class="faces-grid"></div>

                <!-- Kho thẻ tên -->
                <div class="names-section">
                    <h3>🎴 Kéo thẻ vào ô phía dưới mỗi khuôn mặt:</h3>
                    <div id="name-cards-container" class="name-cards"></div>
                </div>

                <!-- Nút hành động -->
                <div class="action-buttons">
                    <!-- Nút nộp bài -->
                    <button id="submit-btn" class="btn submit-btn" onclick="submitAnswer()">
                        Trả lời
                    </button>

                    <!-- Nút Next (JS sẽ tự show/hide khi đúng hoặc reviewMode) -->
                    <button id="next-btn" class="btn next-btn" onclick="nextQuestion()" style="display: none;">
                        ➡️ Next
                    </button>

                    <!-- ❌ Không dùng nữa (không cho chơi lại câu hỏi) -->
                    <button id="retry-btn" style="display:none;"></button>
                    <button id="reset-btn" style="display:none;"></button>
                </div>

                <div id="result-message" class="result-message hidden"></div>
            </div>
        </div>
    </div>

    <!-- Popup kết quả câu hỏi / hoàn thành level -->
    <div id="result-popup" class="popup-overlay hidden">
        <div class="popup-content">
            <div id="popup-icon" class="popup-icon"></div>
            <h2 id="popup-title" class="popup-title"></h2>
            <p id="popup-message" class="popup-message"></p>

            <div class="popup-buttons">
                <button id="popup-replay-btn" class="btn replay-btn" type="button">
                    🔄 Xem lại
                </button>
                <button id="popup-next-btn" class="btn next-btn" type="button">
                    ➡️ Next
                </button>
            </div>
        </div>
    </div>

    <!-- Popup thẻ học cảm xúc -->
    <div id="learning-modal" class="popup-overlay hidden">
        <div class="popup-content learning-popup">
            <h2 id="learning-emotion-title" class="popup-title"></h2>
            <div id="learning-card-body" class="learning-body"></div>
            <div class="popup-buttons">
                <button id="learning-close-btn" class="btn popup-btn close-btn" type="button">
                    Đã hiểu
                </button>
            </div>
        </div>
    </div>

    <script src="../components/game_click_3.js"></script>
    <script src="../components/chatbot_widget.js"></script>
</body>

</html>
