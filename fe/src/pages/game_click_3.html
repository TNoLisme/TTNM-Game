<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmoGarden</title>
    <!-- CSS -->
    <link rel="stylesheet" href="../styles/game_click_3.css" />
    <link rel="stylesheet" href="../styles/chatbot_widget.css" />
</head>

<body>
    <!-- Top back button bar -->
    <div class="top-back-bar">
        <button id="back-button" class="back-btn global-back-btn" type="button" onclick="window.history.back()">&#x2190; Quay lại</button>
    </div>

    <!-- Màn hình chơi game -->
    <div id="game-screen" class="screen">
        <div class="game-container">
            <!-- Header -->
            <div class="game-header">
                <h1 class="game-title">Đang tải...</h1>
                <div class="difficulty-badge" id="difficulty-badge"></div>
            </div>

            <!-- Phần tình huống -->
            <div class="hint-section">
                <button class="speaker-btn" onclick="speakHints()">
                    🔊
                </button>
                <div class="hint-content">
                    <h3>💡 Tình huống:</h3>
                    <div id="hints-list"></div>
                </div>
            </div>

            <!-- Lưới khuôn mặt -->
            <div id="faces-grid" class="faces-grid"></div>

            <!-- Kho thẻ tên -->
            <div class="names-section">
                <h3>🎴 Kéo thẻ vào ô phía dưới mỗi khuôn mặt:</h3>
                <div id="name-cards-container" class="name-cards"></div>
            </div>

            <!-- Nút hành động -->
            <div class="action-buttons">
                <!-- Nút nộp bài -->
                <button id="submit-btn" class="btn-primary submit-btn" onclick="submitAnswer()">
                    ✓ Nộp bài
                </button>

                <!-- Nút thử lại (cho cùng câu hỏi) -->
                <button id="retry-btn" class="retry-btn" onclick="retryAnswer()" style="display: none;">
                    ↩ Thử lại
                </button>

                <!-- Nút chơi lại vòng hiện tại (random lại) -->
                <button id="reset-btn" class="reset-btn" onclick="resetGame()
                        " style="display: none;">
                    🔄 Chơi lại vòng này
                </button>

                <!-- Nút sang câu tiếp theo / level tiếp theo -->
                <button id="next-btn" class="next-btn" onclick="nextQuestion()" style="display: none;">
                    ➡️ Câu hỏi mới
                </button>
            </div>

            <!-- Thông báo kết quả ngắn (nếu cần dùng) -->
            <div id="result-message" class="result-message hidden"></div>
        </div>
    </div>

    <div id="result-popup" class="popup-overlay hidden">
        <div class="popup-content">

            <!-- Nút X -->
            <button id="popup-close-btn" class="popup-close-btn"></button>

            <div id="popup-icon" class="popup-icon"></div>
            <h2 id="popup-title" class="popup-title"></h2>
            <p id="popup-message" class="popup-message"></p>

            <div class="popup-buttons">
                <button class="popup-btn replay-btn" onclick="closePopupAndReplay()">🔄 Chơi lại</button>
                <button id="popup-next-btn" class="popup-btn next-btn" onclick="closePopupAndNext()">➡️ Câu tiếp
                    theo</button>
            </div>
        </div>
    </div>



    <!-- ✅ Popup thẻ học cảm xúc (giống recognize_emotion) -->
    <div id="learning-modal" class="popup-overlay hidden">
        <div class="popup-content learning-popup">
            <h2 id="learning-emotion-title" class="popup-title"></h2>
            <div id="learning-card-body" class="learning-body"></div>
            <div class="popup-buttons">
                <button id="learning-close-btn" class="popup-btn close-btn">
                    Đã hiểu
                </button>
            </div>
        </div>
    </div>


    <script src="../components/game_click_3.js"></script>
    <script src="../components/chatbot_widget.js"></script>
</body>

</html>
