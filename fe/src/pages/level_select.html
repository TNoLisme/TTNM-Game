<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn Cấp độ Game - Emo Garden</title>
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/navigation.css">
    <link rel="stylesheet" href="../styles/level_select.css"> 
    <link rel="stylesheet" href="../styles/chatbot_widget.css"> 
</head>

<body>
    <nav class="main-nav level-select-nav">
      <div class="nav-brand">
        <button type="button" class="back-btn" onclick="window.history.back()">
            ← Quay lại
        </button>
      </div>
      <div class="nav-links">
        <a href="./home.html" class="nav-item">Trang chủ</a>
        <a href="./learn.html" class="nav-item">Học</a>
        <a href="./select_game.html" class="nav-item active" id="game-nav-link">Chơi game</a>
      </div>
      <div class="nav-user-actions">
        <a href="./profile.html" class="nav-profile-link" title="Hồ sơ" id="profile-button">
          <div class="profile-icon"></div>
        </a>
        <button class="nav-logout-btn" id="logout-button">Đăng xuất</button>
      </div>
    </nav>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1> Nhận Diện Cảm Xúc </h1>
            <p class="subtitle">Hoàn thành 1 level để mở khóa level mới!</p>
            <div class="progress-badge">
                <span class="trophy-icon"></span>
                <span class="progress-text">Level đã mở: <span id="unlockedCount">1</span>/8</span>
            </div>
        </div>

        <!-- Level Grid -->
        <div class="level-container">
            <h2 class="level-title">Chọn cấp độ</h2>
            
            <div class="level-grid" id="levelGrid">
                <!-- Levels will be generated by JavaScript -->
            </div>

            <!-- Start Button -->
            <div class="button-container">
                <button id="startButton" class="start-button disabled" disabled>
                    👆 Chọn level để chơi
                </button>
            </div>

            <!-- Selected Level Message -->
            <div id="selectedMessage" class="selected-message hidden">
                ✨ Bạn đã chọn cấp độ <span id="selectedLevelNum"></span>! ✨
            </div>
        </div>
    </div>

    <script src="../components/level_select.js"></script> 
    <script src="../components/chatbot_widget.js"></script>
</body>

</html>
