<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME CLICK - Level 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../styles/recognize_emotion.css">
    <link rel="stylesheet" href="../styles/chatbot_widget.css">
</head>

<body>
    <main class="game-main-content">
        <header class="game-header">
            <div class="header-main">
                <button id="back-button" class="back-btn global-back-btn" type="button"
                    onclick="window.history.back()">&#x2190; Quay lại</button>
                <h1 id="game-name">Chiếc hộp cảm xúc</h1>
                <p class="subtitle">Nhìn hình và chọn cảm xúc phù hợp nhất</p>
            </div>
            <div class="header-actions">
                <div class="stat-pill progress-pill" aria-label="Tiến độ câu hỏi">
                    <div class="click-level-progress">
                        <div id="click-progress-fill" class="click-level-progress-fill"></div>
                    </div>
                    <span id="progress-label">Câu 1/10</span>
                </div>
                <div class="stats">
                    <div class="stat-pill">
                        <span id="score-label">Điểm: 0</span>
                    </div>
                </div>
            </div>
        </header>

        <section class="game-area-grid">
            <div class="question-box">
                <div id="question-area" class="question-content"></div>
                <div class="hint-row">
                    <button id="hint-btn" class="btn btn-secondary" type="button">💡 Gợi ý</button>
                    <p id="hint-content" class="hint-text"></p>
                    <button id="sound-btn" class="btn btn-ghost" type="button">🔊 Nghe lại câu hỏi</button>
                </div>
            </div>

            <div class="answers-card">
                <h2 class="answers-title">Chọn cảm xúc đúng</h2>
                <div id="answer-grid" class="answers-grid">
                    <button class="answer-option" data-answer-id="A"></button>
                    <button class="answer-option" data-answer-id="B"></button>
                    <button class="answer-option" data-answer-id="C"></button>
                    <button class="answer-option" data-answer-id="D"></button>
                    <button class="answer-option" data-answer-id="E"></button>
                    <button class="answer-option" data-answer-id="F"></button>
                </div>
                <div class="controls-row">
                    <button id="next-question-btn" class="btn btn-primary" disabled>Trả lời</button>
                </div>
            </div>
        </section>

    </main>

    <div id="feedback-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">CHÍNH XÁC!</h2>
            <p id="modal-message">Chúc mừng bạn!</p>
            <div class="modal-actions" id="feedback-modal-actions">
            </div>
        </div>
    </div>

    <div id="warning-modal" class="modal hidden">
        <div class="modal-content warning">
            <h2>Chưa trả lời!</h2>
            <p>Vui lòng chọn đáp án cho câu hỏi này trước khi sang câu tiếp theo.</p>
            <button id="close-warning" class="modal-btn">Đóng</button>
        </div>
    </div>

    <div id="learning-modal" class="modal hidden">
        <div class="modal-content learning-content">
            <h2><span id="learning-emotion-title"></span></h2>
            <div id="learning-card-body">
            </div>
            <button id="learning-close-btn" class="modal-btn next-btn" style="margin-top: 20px;">Đã hiểu, tiếp
                tục!</button>
        </div>
    </div>
    <div id="system-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="system-modal-title" class="modal-title"></h2>
            <p id="system-modal-message" class="modal-message"></p>
            <button id="system-modal-btn" class="btn btn-primary modal-btn">OK</button>
        </div>
    </div>

    <script src="../components/chatbot_widget.js"></script>
    <script src="../components/recognize_emotion.js"></script>
    <script src="../components/chatbot_widget.js"></script>
</body>

</html>
