<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chọn Game - Emo Garden</title>
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/navigation.css">
    <link rel="stylesheet" href="../styles/select_game.css">
</head>

<body>
    <nav class="main-nav">
      <div class="nav-brand">
        <img src="../../assets/images/logo.png" alt="Emo Garden Logo" class="brand-logo">
      </div>
      <div class="nav-links">
        <a href="./home.html" class="nav-item active">Trang chủ</a>
        <a href="./learn.html" class="nav-item">Học</a>
        <a href="./select_game.html" class="nav-item" id="game-nav-link">Chơi game</a>
      </div>
      <div class="nav-user-actions">
        <a href="./profile.html" class="nav-profile-link" title="Hồ sơ" id="profile-button">
          <div class="profile-icon"></div>
        </a>
        <button class="nav-logout-btn" id="logout-button">Đăng xuất</button>
      </div>
    </nav>

    <main class="main-content">

        <div class="game-main-layout">
            
            <section class="game-category-section">
                <h2 class="category-title">🎮 Rèn luyện nhận biết cảm xúc</h2>
                <div class="game-grid" id="game-click-list">
                    
                    <div class="game-block" data-game-id="GC1">
                        <img src="/fe/assets/images/game_click_1_thumb.png" alt="Nhận diện cảm xúc" class="game-thumb">
                        <!--<p class="game-desc">Nhận diện cảm xúc qua hình ảnh/âm thanh/video.</p> -->
                        <button class="play-btn">Chiếc hộp cảm xúc</button>
                    </div>

                    <div class="game-block" data-game-id="GC2">
                        <img src="/fe/assets/images/game_click_2_thumb.png" alt="Lắp ghép" class="game-thumb">
                       <!-- <h3 class="game-name">Xưởng Lắp Ghép Cảm Xúc</h3>
                      <p class="game-desc">Lắp các bộ phận khuôn mặt để tạo cảm xúc.</p>--> 
                        <button class="play-btn">Xưởng lắp ghép cảm xúc</button>
                    </div>

                    <div class="game-block" data-game-id="GC3">
                        <img src="/fe/assets/images/game_click_3_thumb.png" alt="Ai đang biểu hiện" class="game-thumb">
                       
                        <button class="play-btn">Thám tử cảm xúc</button>
                    </div>

                    <div class="game-block" data-game-id="GC4">
                        <img src="/fe/assets/images/game_click_4_thumb.png" alt="Tình huống" class="game-thumb">
                        <button class="play-btn">Cảm xúc đúng chỗ</button>
                    </div>
                </div>
            </section>

            <section class="game-category-section">
                <h2 class="category-title">💻 Rèn luyện biểu đạt cảm xúc</h2>
                <div class="game-grid" id="game-cv-list">
                    
                    <div class="game-block" data-game-id="GV1">
                        <img src="/fe/assets/images/game_cv_1_thumb.png" alt="Biểu cảm yêu cầu" class="game-thumb">
                        <button class="play-btn">Thử thách cảm xúc</button>
                    </div>

                    <div class="game-block" data-game-id="GV2">
                        <img src="/fe/assets/images/game_cv_2_thumb.png" alt="Biểu cảm theo tình huống" class="game-thumb">
                        <button class="play-btn">Câu chuyện trên khuôn mặt</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../components/select_game.js"></script> 
</body>

</html>
